<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<title>Q4Quiz2</title>
<style type="text/css">
	body{
		background-image: url(https://images.pexels.com/photos/7130560/pexels-photo-7130560.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2);
		background-repeat: no-repeat;
		background-size: cover;
		background-position: fixed;
	}
	img{
		width: 400px;
		height: 700px;
		border: 4px solid black;
 		border-radius: 10px;
	}

	h1{
		font-family: monospace, Lucida Console;
		background-color: lightpink;
		border: 4px solid black;
 		border-radius: 10px;
	}

	details{
		font-family: monospace, Lucida Console;
	}

	input{
		font-family: monospace, Lucida Console;
		border: 4px solid black;
 		border-radius: 10px;
	}

	#button1{
		font-family: monospace, Lucida Console;
		font-size: 30px;
		background-color: lightpink;
		border: 2px solid black;
 		border-radius: 5px;
	}

	kbd{
		font-size: 30px;
	}
</style>
</head>
<body>
<center>
<h1>Average Grade Analyzer</h1>
<details ontoggle="instructions()">
	<summary>Instructions</summary>
	<i id="revealmee"></i>
	<p>Input your grade for each subject in the boxes below.</p>
</details>

<br>

<div class="container">
	<div class="row">
		<div class="col-md-4">
			<img src="science.png">
			<br><br>
			<!-- value -->
			<input type="number" class="form-control" placeholder="Type here..." id="sgrade">
		</div>
		<div class="col-md-4">
			<img src="math.png">
			<br><br>
			<!-- value -->

			<input type="number" class="form-control" placeholder="Type here..." id="mgrade">
		</div>
		<div class="col-md-4">
			<img src="ss.png">
			<br><br>
			<!-- value -->
			<input type="number" class="form-control" placeholder="Type here..." id="ssgrade">
		</div>
	</div>
</div>

<br>

<button id="button1" type="Submit" class="btn btn-default" onclick="results()">Get my analysis</button>
<br>
<kbd id="show_here">Analysis</kbd>

</center>
<script type="text/javascript">
//javascript coding
function results(){
	let science = Number(document.getElementById("sgrade").value);
	let math = Number(document.getElementById("mgrade").value);
	let ss = Number(document.getElementById("ssgrade").value);
	let average = ((science + math + ss)/3).toFixed(2);
	
	//conditon
switch(true){
	case(average >= 70 && average <= 74.99):
	analysis = "Your average is poor.";
	break;

	case(average >= 75 && average <= 79.99):
	analysis = "Your average is needs improvement.";
	break;

	case(average >= 80 && average <= 86.99):
	analysis = "Your average is satisfactory.";
	break;

	case(average >= 87 && average <= 93.99):
	analysis = "Your average is above satisfactory.";
	break;

	case(average >= 94 && average <= 100):
	analysis = "Your average is excellent.";
	break;
	}

	document.getElementById("show_here").innerText = analysis;
}

</script>


</body>
</html>
